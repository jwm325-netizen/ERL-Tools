<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agreement Lines - JSON to CSV</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 1100px; margin: 20px auto; padding: 0 20px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        textarea { width: 100%; height: 180px; font-family: monospace; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .controls { margin-top: 15px; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        #status { font-size: 14px; font-weight: bold; color: #6366f1; margin-top: 10px; }
        #fieldSelector { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .field-item { display: flex; align-items: center; font-size: 13px; background: #f1f5f9; padding: 8px; border-radius: 4px; border: 1px solid #e2e8f0; }
        .field-item input { margin-right: 10px; }
        .hidden { display: none; }
        .error-msg { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 6px; margin-top: 10px; display: none; border: 1px solid #fecaca; }
        h2 { margin-top: 0; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>Agreement Lines - JSON to CSV</h1>

    <div class="card">
        <h2>1. Paste API Response (JSON)</h2>
        <textarea id="jsonInput" placeholder="Paste the results here..."></textarea>
        
        <div id="errorBox" class="error-msg"></div>

        <div class="controls">
            <button id="analyzeBtn" onclick="runAnalysis()">Analyze Data</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="selectionArea" class="card hidden">
        <h2>2. Select CSV Columns</h2>
        <div id="fieldSelector"></div>
        <br>
        <button onclick="downloadCSV()" style="background: #10b981;">Download CSV File</button>
    </div>

    <script>
        let processedData = [];

        function runAnalysis() {
            const inputField = document.getElementById('jsonInput');
            const status = document.getElementById('status');
            const errorBox = document.getElementById('errorBox');
            
            // Reset UI
            errorBox.style.display = 'none';
            status.innerText = "";
            processedData = [];

            try {
                const rawData = JSON.parse(inputField.value);
                
                // Detect if input is a list (results) or a single record
                let items = [];
                if (rawData.results) {
                    items = rawData.results;
                } else if (Array.isArray(rawData)) {
                    items = rawData;
                } else {
                    items = [rawData];
                }

                status.innerText = `Processing ${items.length} records...`;

                items.forEach(item => {
                    let flat = {};

                    // 1. KBID Logic
                    const fullKBID = item.reference || ''; // e.g., "38-467-100572"
                    flat["KBID"] = fullKBID;

                    // Extract Package KBID (take first two segments of the hyphenated string)
                    if (fullKBID.includes('-')) {
                        const parts = fullKBID.split('-');
                        // If it has 3 parts (XX-XXX-XXXXXX), take the first two
                        flat["Package KBID"] = parts.slice(0, 2).join('-');
                    } else {
                        flat["Package KBID"] = fullKBID;
                    }

                    // 2. Title & Basic Info
                    flat["Title"] = item.description || item.reference_object?.label || 'Untitled';
                    
                    // 3. Identifiers (Local JSON only)
                    const refObj = item.reference_object || {};
                    const pissn = refObj.identifiers?.find(id => id.identifier.ns.value === 'pissn')?.identifier.value;
                    const eissn = refObj.identifiers?.find(id => id.identifier.ns.value === 'eissn')?.identifier.value;
                    
                    flat["pISSN"] = pissn || '';
                    flat["eISSN"] = eissn || '';

                    // 4. Additional Context
                    flat["URL"] = refObj.url || '';
                    flat["Package Name"] = refObj.packageData?.name || '';
                    flat["Coverage Summary"] = item.coverage?.[0]?.summary || '';
                    flat["PO Line"] = item.poLines?.[0]?.poLineId || '';

                    processedData.push(flat);
                });

                renderSelector();
                status.innerText = `Successfully analyzed ${processedData.length} titles.`;

            } catch (e) {
                errorBox.innerText = "Error: " + e.message;
                errorBox.style.display = 'block';
            }
        }

        function renderSelector() {
            const selector = document.getElementById('fieldSelector');
            selector.innerHTML = '';
            
            if (processedData.length === 0) return;

            // Find all unique keys across all objects
            const allKeys = [...new Set(processedData.flatMap(Object.keys))];
            
            allKeys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'field-item';
                div.innerHTML = `
                    <input type="checkbox" id="chk_${key}" checked value="${key}">
                    <label for="chk_${key}">${key}</label>
                `;
                selector.appendChild(div);
            });
            document.getElementById('selectionArea').classList.remove('hidden');
        }

        function downloadCSV() {
            const selectedKeys = Array.from(document.querySelectorAll('#fieldSelector input:checked')).map(cb => cb.value);
            if (selectedKeys.length === 0) return;

            let csvContent = selectedKeys.join(',') + '\n';

            processedData.forEach(row => {
                const values = selectedKeys.map(key => {
                    let val = row[key] ? String(row[key]) : '';
                    // Clean up for CSV safety
                    return `"${val.replace(/"/g, '""')}"`;
                });
                csvContent += values.join(',') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `ERM_Export_${new Date().getTime()}.csv`;
            link.click();
        }
    </script>
</body>
</html>
